[project]
name = "solvay"
version = "0.1.0"
description = "Multi-agent physics problem solver built on deepagents"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.1",
    "langgraph>=0.4",
    "langchain>=0.4",
    "langchain-anthropic>=0.4",
    "sympy>=1.13",
    "scipy>=1.14",
    "numpy>=2.1",
    "astropy>=7.0",
    "pint>=0.24",
    "uncertainties>=3.2",
    "mpmath>=1.3",
    "matplotlib>=3.9",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "typer[all]>=0.15",
    "pydantic>=2.10",
    "tavily-python>=0.5",
    "RestrictedPython>=7.4",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
solvay = "solvay.cli:app"
solvay-bench = "solvay.benchmark.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solvay"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer's standard pattern uses these as argument defaults; not actually
# mutable shared state. Same allowlist FastAPI projects use.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tavily", "tavily.*"]
ignore_missing_imports = true

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "langchain-core>=0.4",
]
